<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthyLife - Login & Register</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-hero">
        <div class="floating-icons">
          <span class="floating-icon">🥗</span>
          <span class="floating-icon">🥑</span>
          <span class="floating-icon">🥦</span>
          <span class="floating-icon">🍳</span>
          <span class="floating-icon">🥕</span>
        </div>

        <div class="auth-hero-content">
          <h1>HealthyLife</h1>
          <p class="subheading">
            Your personalized nutrition journey starts here
          </p>

          <div class="feature-badges">
            <div class="feature-badge">
              <i class="fas fa-utensils"></i>
              <span>Personalized Meal Plans</span>
            </div>
            <div class="feature-badge">
              <i class="fas fa-chart-line"></i>
              <span>Track Your Progress</span>
            </div>
            <div class="feature-badge">
              <i class="fas fa-user-md"></i>
              <span>Expert Dietitian Support</span>
            </div>
          </div>
        </div>
      </div>

      <div class="auth-form-section">
        <div class="auth-form-card">
          <div class="auth-logo">
            <i class="fas fa-leaf"></i>
            <span>HealthyLife</span>
          </div>

          <div class="auth-tabs">
            <div class="auth-tab active" id="loginTab" onclick="showForm('login')">
              Login
            </div>
            <div class="auth-tab" id="registerTab" onclick="showForm('register')">
              Register
            </div>
          </div>

          <form
            id="loginForm"
            class="auth-form active"
            onsubmit="handleLogin(event)"
          >
            <div class="form-group">
              <label class="form-label" for="loginEmail">Email Address</label>
              <input
                type="email"
                id="loginEmail"
                class="form-control"
                placeholder="Enter your email"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="loginPassword">Password</label>
              <input
                type="password"
                id="loginPassword"
                class="form-control"
                placeholder="Enter your password"
                required
              />
            </div>

            <div class="form-group form-row-inline">
              <div class="form-check">
                <input type="checkbox" id="rememberMe" />
                <label for="rememberMe">Remember me</label>
              </div>
              <a href="#" class="form-link">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
              <i class="fas fa-sign-in-alt"></i> Login
            </button>
          </form>

          <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
            <div class="form-group">
              <label class="form-label" for="registerName">Full Name</label>
              <input
                type="text"
                id="registerName"
                class="form-control"
                placeholder="Enter your full name"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="registerEmail">Email Address</label>
              <input
                type="email"
                id="registerEmail"
                class="form-control"
                placeholder="Enter your email"
                required
              />
            </div>

            <label class="form-label">Select Your Role</label>
            <div class="role-selector">
              <div
                class="role-option selected"
                data-role="user"
                onclick="selectRole('user')"
              >
                <i class="fas fa-user"></i>
                <span>User</span>
                <i class="fas fa-check-circle check-icon"></i>
              </div>
              <div
                class="role-option"
                data-role="dietitian"
                onclick="selectRole('dietitian')"
              >
                <i class="fas fa-user-nurse"></i>
                <span>Dietitian</span>
                <i class="fas fa-check-circle check-icon"></i>
              </div>
              <div
                class="role-option"
                data-role="admin"
                onclick="selectRole('admin')"
              >
                <i class="fas fa-user-shield"></i>
                <span>Admin</span>
                <i class="fas fa-check-circle check-icon"></i>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="registerPassword">Password</label>
              <input
                type="password"
                id="registerPassword"
                class="form-control"
                placeholder="Create a password"
                required
                oninput="checkPasswordStrength()"
              />
              <div class="password-strength">
                <div class="strength-bar">
                  <div class="strength-fill" id="strengthFill"></div>
                </div>
                <span class="strength-text" id="strengthText"
                  >Password strength:
                </span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="confirmPassword">
                Confirm Password
              </label>
              <input
                type="password"
                id="confirmPassword"
                class="form-control"
                placeholder="Confirm your password"
                required
              />
            </div>

            <button type="submit" class="btn btn-primary btn-block">
              <i class="fas fa-user-plus"></i> Create Account
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/auth.js?v=20260509-2"></script>
  </body>
</html>
